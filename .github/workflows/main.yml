name: CI

on:
  push:
    branches: [ master, mp-foundation ]
  pull_request:
    branches: [ master, mp-foundation ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [
          {
            cc: gcc,
            cxx: g++
          },
          {
            cc: clang,
            cxx: clang++
          }
        ]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq g++ clang libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Build
        id: build
        continue-on-error: true
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake . && make -j4 flare flare-server

      - name: Check Status
        if: steps.build.outcome != 'success'
        run: exit 1

  rng-guard:
    # The four Math:: helpers and the global generator were removed in P0.3b so that every
    # random draw has to name sim_rng or fx_rng. Nothing in the type system enforces that, so
    # this does. Run the same command locally before pushing:
    #
    #   git grep -nE '(^|[^_[:alnum:]])s?rand[[:space:]]*\(|Math::randBetween|Math::percentChance|RAND_MAX' -- 'src/*.cpp' 'src/*.h'
    #
    # It matches comments as well as code, on purpose: an exception list is how a guard rots
    # into decoration. Describe the old API without naming it.
    #
    # NOTE the pattern avoids \b. git grep -E uses POSIX ERE, where \b is not a word boundary,
    # so a \brand\(\) pattern silently matches NOTHING -- it looked correct and was blind to
    # the single most important case. Verified against seven reintroduction forms.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No global RNG in src/
        run: |
          if git grep -nE '(^|[^_[:alnum:]])s?rand[[:space:]]*\(|Math::randBetween|Math::percentChance|RAND_MAX' -- 'src/*.cpp' 'src/*.h'; then
            echo ""
            echo "ERROR: the global random generator is back in src/."
            echo "Every draw must name a stream. See src/Rng.h:"
            echo "  sim_rng  simulation -- authority tick only, reproducible"
            echo "  fx_rng   presentation and client-local UI"
            echo ""
            echo "  randBetween(a, b)  -> rng->range(a, b)"
            echo "  randBetweenF(a, b) -> rng->rangeF(a, b)"
            echo "  percentChance(p)   -> rng->percentChance(p)"
            echo "  x % container.size() -> rng->index(container.size())"
            exit 1
          fi
          echo "OK: no global RNG call sites in src/"

  replays:
    # Replays a corpus of recorded input and compares world-state digests against committed
    # goldens. This is the regression test Phases 1 and 2 lean on: almost every plan in them is a
    # behaviour-preserving refactor, and this is what turns "did it change anything?" into an
    # exit code.
    #
    # flare-game is PINNED to a commit on purpose. The goldens are digests of a simulation running
    # that mod data, so a flare-game update moves them and would turn this job red for a change
    # that is not a regression. Bumping the pin means re-recording the goldens in the same commit.
    #
    # Goldens are PER-PLATFORM AND PER-COMPILER, and the matrix is the measuring instrument.
    #
    # WHAT IS KNOWN, measured by the first runs after P0.5c fixed the fixture step:
    #
    #   gcc and clang, same machine   -- agree byte-for-byte on every digest. NOT codegen.
    #   macOS/arm64 vs Linux/x86-64   -- diverge BEHAVIOURALLY, not just in the hash. Those show
    #                                    up as coverage failures below.
    #
    # WHAT THE DIVERGENCE ACTUALLY IS -- corrected in P1.3d-3, after the 'equipped' field made the
    # simevents lines comparable side by side. This block used to say 'melee' "kills two enemies on
    # macOS and kills nothing on Linux". That is WRONG, and the number that says so was on screen
    # the whole time:
    #
    #   melee, macOS arm64      die=2  critdie=0  loot=2  levelup=1
    #   melee, Linux x86-64     die=0  critdie=2  loot=2  levelup=1
    #
    # The same two enemies die on both. On Linux the killing blow is a CRITICAL hit, so the engine
    # emits SFX_CRITDIE instead of SFX_DIE and the 'die' requirement fails. The divergence is in a
    # damage roll crossing a threshold, not in whether the AI fights at all.
    #
    # 'beatdown' is a real difference and survives the correction: macOS takes 16 hits and drops
    # into the low-HP band once; Linux x86-64 takes 10 and never does. But "the game is easier on
    # Linux" is too glib -- Linux arm64 takes 24 hits and still never drops into the band.
    #
    # KEEP the 'die' requirement as it is. It is mis-NAMED for what it detects, not mis-designed:
    # it is currently the only thing in the suite that notices this at all, and relaxing it to
    # 'die or critdie' would delete the detector to make the label true.
    #
    # WHAT THE 'os' AXIS ANSWERED. arm64 Linux was added to say whether the divergence was the OS
    # or the instruction set. It is BOTH -- arm64 Linux is a third distinct outcome, not a copy of
    # either neighbour:
    #
    #   'melee'    splits by ISA: both arm64 columns kill enemies, x86-64 kills nothing.
    #   'beatdown' splits by OS:  both Linux columns miss the low-HP warning, macOS fires it.
    #   every digest differs three ways, INCLUDING 'smoke' -- which is slot 1 with no equipment,
    #   no powers and no combat. Plain movement already produces three different worlds.
    #
    # So there is no single culprit to find and delete, and lockstep is off the table: buying
    # bit-identical simulation would mean a fixed-point rewrite of every position, speed and damage
    # number in the engine. Phase 3 uses an authoritative host instead, and determinism stops being
    # load-bearing for correctness.
    #
    # The matrix STAYS, but not for the reason first written here. That said "a host and a
    # rejoining client still have to agree", which is WRONG: under an authoritative host a
    # rejoining client receives a state snapshot and never simulates, so it needs determinism from
    # nobody. That reasoning was carried over from the lockstep design without being re-checked
    # against the decision that replaced it.
    #
    # The real reason is the COVERAGE assertions, not the digests. They are what found that 'melee'
    # kills nothing on x86-64 Linux and 'beatdown' never triggers the low-HP warning there -- the
    # game is measurably easier on Linux. That is a player-facing difference and it matters whether
    # or not networking is involved. A digest comparison alone would only have said "different
    # hash" on a platform with no golden to compare against.
    #
    # Hence the split below: coverage and liveness are hard failures on every platform, while the
    # digest comparison is a same-machine regression test and only applies where a golden exists.
    # See tests/run-replays.sh.
    #
    # Linux goldens are still deliberately unrecorded. A golden for a platform where 'melee' does
    # not melee would rebuild the P0.5c mistake in a new form -- see the coverage block in
    # tests/run-replays.sh. Missing goldens fail the job AND print the digest, which is what makes
    # one run enough to compare platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        compiler: [ { cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ } ]
    env:
      FLARE_GAME_COMMIT: af6eee6d339ac98011864bfe89da837fe7769c28
      FLARE_GOLDEN_SUFFIX: ${{ matrix.compiler.cc }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq g++ libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Fetch game data
        run: |
          git clone --no-checkout https://github.com/lanrevival/flare-game.git ../flare-game
          git -C ../flare-game checkout "$FLARE_GAME_COMMIT"

      - name: Assemble a combined mods tree
        run: |
          # Neither repo is runnable alone: flare-engine/mods has only 'default', the campaigns
          # live in flare-game/mods.
          mkdir -p /tmp/flaredata/mods
          ln -s "$GITHUB_WORKSPACE/mods/default" /tmp/flaredata/mods/default
          for d in ../flare-game/mods/*/; do ln -s "$(cd "$d" && pwd)" "/tmp/flaredata/mods/$(basename "$d")"; done

      - name: Build server
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake . && make -j4 flare-server

      - name: Run replays
        run: ./tests/run-replays.sh /tmp/flaredata

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev cppcheck

      - name: Run cppcheck
        run: cppcheck --quiet --verbose --enable=all `git ls-files src/\*.cpp`
