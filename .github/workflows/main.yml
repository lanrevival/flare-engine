name: CI

on:
  push:
    branches: [ master, mp-foundation ]
  pull_request:
    branches: [ master, mp-foundation ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [
          {
            cc: gcc,
            cxx: g++
          },
          {
            cc: clang,
            cxx: clang++
          }
        ]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq g++ clang libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Build
        id: build
        continue-on-error: true
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake . && make -j4 flare flare-server

      - name: Check Status
        if: steps.build.outcome != 'success'
        run: exit 1

  rng-guard:
    # The four Math:: helpers and the global generator were removed in P0.3b so that every
    # random draw has to name sim_rng or fx_rng. Nothing in the type system enforces that, so
    # this does. Run the same command locally before pushing:
    #
    #   git grep -nE '(^|[^_[:alnum:]])s?rand[[:space:]]*\(|Math::randBetween|Math::percentChance|RAND_MAX' -- 'src/*.cpp' 'src/*.h'
    #
    # It matches comments as well as code, on purpose: an exception list is how a guard rots
    # into decoration. Describe the old API without naming it.
    #
    # NOTE the pattern avoids \b. git grep -E uses POSIX ERE, where \b is not a word boundary,
    # so a \brand\(\) pattern silently matches NOTHING -- it looked correct and was blind to
    # the single most important case. Verified against seven reintroduction forms.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No global RNG in src/
        run: |
          if git grep -nE '(^|[^_[:alnum:]])s?rand[[:space:]]*\(|Math::randBetween|Math::percentChance|RAND_MAX' -- 'src/*.cpp' 'src/*.h'; then
            echo ""
            echo "ERROR: the global random generator is back in src/."
            echo "Every draw must name a stream. See src/Rng.h:"
            echo "  sim_rng  simulation -- authority tick only, reproducible"
            echo "  fx_rng   presentation and client-local UI"
            echo ""
            echo "  randBetween(a, b)  -> rng->range(a, b)"
            echo "  randBetweenF(a, b) -> rng->rangeF(a, b)"
            echo "  percentChance(p)   -> rng->percentChance(p)"
            echo "  x % container.size() -> rng->index(container.size())"
            exit 1
          fi
          echo "OK: no global RNG call sites in src/"

  inventory-guard:
    # P1.3d-4 moved the item storage out of MenuInventory and into PlayerInventory, so that a
    # character's possessions are not owned by a window. Nothing in the type system enforces that
    # -- MenuInventory still holds a handle to the same two storages for rendering -- so this does.
    # Run the same thing locally before pushing:
    #
    #   git grep -n 'inv->inventory\[' -- 'src/*.cpp' 'src/*.h' \
    #     | grep -v '^src/MenuInventory\.' | sed 's/pinv->inventory\[//g' | grep 'inv->inventory\['
    #
    # WHY THE sed. 'pinv->inventory[' contains 'inv->inventory[', so the pattern matches the
    # correct code too. Filtering with `grep -v pinv` instead is the obvious fix and it is WRONG:
    # a line holding BOTH spellings -- the exact shape of a half-finished migration, e.g.
    # `pinv->inventory[0] = menu->inv->inventory[0];` -- is then dropped whole and the guard goes
    # blind on the one case it most needs to see. Deleting the good spelling first and matching
    # what is left has no such hole. Verified against nine reintroduction forms, including that
    # mixed line, `menu_inv->` (a parameter, which a `[^_[:alnum:]]` guard would have MISSED
    # because of the underscore), a bare member `inv->`, and an arbitrary `gs->inv->`.
    #
    # It matches comments as well as code, deliberately, for the reason the RNG guard above gives.
    # MenuInventory.cpp/.h are excluded because that class legitimately holds the handle.
    # MenuManager.cpp is excluded too, since P1.3d-4c: it is the drag-and-drop/tooltip hub across
    # every menu, and its `inv` member IS the MenuInventory instance -- `inv->inventory[...]` there
    # is the same handle, reached one hop further out, for the same widget-level reasons
    # (highlightMatching(), .slots[], drag_prev_slot, checkTooltip(), getItemStackAtPos()). Before
    # P1.3d-4c this didn't need an exclusion: those call sites went through pinv->inventory[...],
    # which the sed already tolerates, because PlayerInventory::inventory was still MenuItemStorage-
    # typed and had those widget methods too. P1.3d-4c is what split the types apart -- pinv's
    # storage lost render()/slots/click() and kept only ItemStorage's data methods -- which is what
    # forced MenuManager.cpp to name the actual widget owner instead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Item storage is reached through pinv, not through a menu
        run: |
          hits=$(git grep -n 'inv->inventory\[' -- 'src/*.cpp' 'src/*.h' \
                 | grep -v '^src/MenuInventory\.' \
                 | grep -v '^src/MenuManager\.cpp:' \
                 | sed 's/pinv->inventory\[//g' \
                 | grep 'inv->inventory\[' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "ERROR: item data is being reached through the inventory menu."
            echo "The two storages belong to PlayerInventory. See src/PlayerInventory.h:"
            echo "  menu->inv->inventory[MenuInventory::CARRIED] -> pinv->inventory[PlayerInventory::CARRIED]"
            echo ""
            echo "MenuInventory keeps a MenuItemStorage handle for RENDERING (bound, since"
            echo "P1.3d-4c, to PlayerInventory's ItemStorage via MenuItemStorage::bind() -- not a"
            echo "second copy). It is not the way to ask what a player is carrying: pinv->inventory"
            echo "is plain ItemStorage now and has no widget methods to reach through a menu for."
            exit 1
          fi
          echo "OK: no menu-routed item storage access in src/"

      - name: The character answers questions about its own possessions, not the window
        run: |
          # P1.3d-4b-2 moved seven read-only inventory queries to PlayerInventory. Unlike the
          # storage check above, the compiler already enforces the call side: the declarations are
          # gone from MenuInventory, so `menu->inv->isEquipSlotActive(...)` no longer builds. What
          # the compiler CANNOT catch is somebody putting a forwarder back on MenuInventory to
          # "fix" a build error, which would quietly restore the coupling. That is what this checks,
          # and it is the whole reason it looks at the header rather than at call sites.
          moved='isEquipSlotActive|equipmentContain|getEquippedSetCount|getEquipSlotFromItem|canActivateItem|getPowerMod|removeCurrency|ONLY_EMPTY_SLOTS'
          hits=$(grep -nE "$moved" src/MenuInventory.h || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "MenuInventory.h names something that belongs to PlayerInventory now."
            echo "These moved in P1.3d-4b-2 and must not come back, not even as forwarders:"
            echo "  $moved"
            echo "Call them on pinv instead. See plans/phase1/P1.3d-4-player-inventory.md."
            exit 1
          fi
          echo "OK: MenuInventory.h claims none of the moved inventory queries"

      - name: Hotkey state is reached through pab, not through a menu, in the sim-side consumers
        run: |
          # P1.3e-b repointed GameStatePlay, SaveLoad and EntityManager off menu->act-> / menu_act->
          # and onto pab-> for ActionBarState's seven fields. Unlike the inventory storage check
          # above, this is scoped to those three files, not all of src/: menu->act->clear(),
          # ->set() and ->checkAction() are METHOD calls that legitimately still go through the
          # menu (they move in P1.3e-c, or never -- checkAction() needs widgets and runs headless
          # never), and MenuInventory.cpp's addPower(), MenuPowers.cpp and MenuManager.cpp are UI
          # that never moves. A blanket ban across src/*.cpp would flag all of those. Matching only
          # the seven field names, word-bounded, is what tells a legitimate method call apart from
          # a reintroduced field read without needing a file-wide exclusion list.
          fields='slots_count|hotkeys_temp|hotkeys_mod|hotkeys|locked|requires_attention|updated'
          hits=$(grep -nE "(menu->act->|menu_act->)($fields)\b" \
                 src/GameStatePlay.cpp src/SaveLoad.cpp src/EntityManager.cpp || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "ERROR: action bar state is being reached through the action bar menu."
            echo "These seven fields belong to ActionBarState. See src/ActionBarState.h:"
            echo "  menu->act->hotkeys[i] -> pab->hotkeys[i]"
            echo ""
            echo "menu->act->clear()/set()/checkAction() are unaffected -- those are method calls,"
            echo "not field reads, and P1.3e-b did not move them."
            exit 1
          fi
          echo "OK: no menu-routed action bar state access in the sim-side consumers"

      - name: Power bonus levels are reached through pbs, not through a menu
        run: |
          # P1.3g moved current_cell/bonus_levels off MenuPowers and onto PowerBonusState (pbs),
          # so that PlayerInventory::applyEquipment() -- once P1.3d-4b-3 moves it -- can reset and
          # recompute item/set power-level bonuses without reaching into MenuPowers. Only two call
          # sites ever reached the moved methods: MenuInventory.cpp (applyEquipment()/applyBonus())
          # and SaveLoad.cpp (the pre-save action bar reset). Both are already repointed to pbs->;
          # this guard is what stops a future edit from putting menu->pow-> back, the same shape as
          # the hotkey-state guard above. menu->pow->setUnlockedPowers()/resetToBasePowers() and
          # every other MenuPowers method are unaffected -- those genuinely stayed on MenuPowers,
          # unmoved, and are not matched by this pattern.
          moved='clearBonusLevels|addBonusLevels|clearActionBarBonusLevels'
          hits=$(grep -nE "(menu->pow->|menu_powers->)($moved)\b" \
                 src/MenuInventory.cpp src/SaveLoad.cpp src/GameStatePlay.cpp src/EntityManager.cpp || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "ERROR: power bonus-level state is being reached through the powers menu."
            echo "These three methods belong to PowerBonusState. See src/PowerBonusState.h:"
            echo "  menu->pow->clearBonusLevels() -> pbs->clearBonusLevels()"
            exit 1
          fi
          echo "OK: no menu-routed power bonus-level access in the sim-side consumers"

      - name: Inventory mutators are reached through pinv, not through a menu
        run: |
          # P1.3d-4b-3 moved add()/remove()/addCurrency()/applyEquipment()/applyDeathPenalty()/
          # fillEquipmentSlots() off MenuInventory and onto PlayerInventory (pinv), now that P1.3e
          # (pab) and P1.3g (pbs) removed the two things that used to force them through a menu.
          # MenuInventory keeps thin wrappers for add()/remove()/applyEquipment() -- see
          # PlayerInventory.h -- used by its own drop()/activate()/buy()/itemReturn() and by
          # MenuManager/MenuPowers, none of which this guard touches. What it bans is a sim-side
          # file reaching those wrappers instead of calling pinv-> directly.
          #
          # remove() is checked separately: GameStatePlay.cpp keeps exactly ONE call through the
          # wrapper, documented at its call site, because MenuInventory's activated_item/
          # activated_slot special case (which pinv->remove() deliberately does not have) is what
          # makes a right-click item activation consume the exact slot the player clicked. That is
          # the only sanctioned exception in the whole tree -- if this count is ever 0, the comment
          # protecting it was deleted along with the call; if it's ever >1, a new one snuck in.
          moved='add|addCurrency|applyEquipment\(\)|applyDeathPenalty|fillEquipmentSlots'
          hits=$(grep -nE "menu->inv->($moved)\(" \
                 src/CampaignManager.cpp src/PowerManager.cpp src/EventManager.cpp \
                 src/GameStatePlay.cpp src/SaveLoad.cpp src/EntityManager.cpp || true)
          removehits=$(grep -nE 'menu->inv->remove\(' \
                 src/CampaignManager.cpp src/PowerManager.cpp src/EventManager.cpp \
                 src/SaveLoad.cpp src/EntityManager.cpp || true)
          removecount_gsp=$(grep -cE 'menu->inv->remove\(' src/GameStatePlay.cpp || true)
          if [ -n "$hits" ] || [ -n "$removehits" ] || [ "$removecount_gsp" -ne 1 ]; then
            echo "$hits"
            echo "$removehits"
            echo "GameStatePlay.cpp menu->inv->remove() count: $removecount_gsp (expected 1)"
            echo ""
            echo "ERROR: inventory mutator state is being reached through the inventory menu."
            echo "These belong to PlayerInventory now. See src/PlayerInventory.h:"
            echo "  menu->inv->add(...) -> pinv->add(...)"
            exit 1
          fi
          echo "OK: no menu-routed inventory mutator access in the sim-side consumers"

  replays:
    # Replays a corpus of recorded input and compares world-state digests against committed
    # goldens. This is the regression test Phases 1 and 2 lean on: almost every plan in them is a
    # behaviour-preserving refactor, and this is what turns "did it change anything?" into an
    # exit code.
    #
    # flare-game is PINNED to a commit on purpose. The goldens are digests of a simulation running
    # that mod data, so a flare-game update moves them and would turn this job red for a change
    # that is not a regression. Bumping the pin means re-recording the goldens in the same commit.
    #
    # Goldens are PER-PLATFORM AND PER-COMPILER, and the matrix is the measuring instrument.
    #
    # WHAT IS KNOWN, measured by the first runs after P0.5c fixed the fixture step:
    #
    #   gcc and clang, same machine   -- agree byte-for-byte on every digest. NOT codegen.
    #   macOS/arm64 vs Linux/x86-64   -- diverge BEHAVIOURALLY, not just in the hash. Those show
    #                                    up as coverage failures below.
    #
    # WHAT THE DIVERGENCE ACTUALLY IS -- corrected in P1.3d-3, after the 'equipped' field made the
    # simevents lines comparable side by side. This block used to say 'melee' "kills two enemies on
    # macOS and kills nothing on Linux". That is WRONG, and the number that says so was on screen
    # the whole time:
    #
    #   melee, macOS arm64      die=2  critdie=0  loot=2  levelup=1
    #   melee, Linux x86-64     die=0  critdie=2  loot=2  levelup=1
    #
    # The same two enemies die on both. On Linux the killing blow is a CRITICAL hit, so the engine
    # emits SFX_CRITDIE instead of SFX_DIE and the 'die' requirement fails. The divergence is in a
    # damage roll crossing a threshold, not in whether the AI fights at all.
    #
    # 'beatdown' is a real difference and survives the correction: macOS takes 16 hits and drops
    # into the low-HP band once; Linux x86-64 takes 10 and never does. But "the game is easier on
    # Linux" is too glib -- Linux arm64 takes 24 hits and still never drops into the band.
    #
    # KEEP the 'die' requirement as it is. It is mis-NAMED for what it detects, not mis-designed:
    # it is currently the only thing in the suite that notices this at all, and relaxing it to
    # 'die or critdie' would delete the detector to make the label true.
    #
    # WHAT THE 'os' AXIS ANSWERED. arm64 Linux was added to say whether the divergence was the OS
    # or the instruction set. It is BOTH -- arm64 Linux is a third distinct outcome, not a copy of
    # either neighbour:
    #
    #   'melee'    splits by ISA: both arm64 columns fire 'die', x86-64 fires 'critdie' instead.
    #              Enemies die in all three -- see the correction above.
    #   'beatdown' splits by OS:  both Linux columns miss the low-HP warning, macOS fires it.
    #   'deathfull' splits by ISA too, and this one is the most concrete of the three. The death
    #              penalty picks a random carried stack and removes ONE UNIT of it. The fixture
    #              carries [Cloth Shirt, Cloth Pants, 750 currency], so the draw decides whether a
    #              slot empties: macOS and arm64 Linux draw index 0 and the shirt is destroyed
    #              (carried 3 -> 2), x86-64 Linux leaves 3 slots filled, which is only possible if
    #              it drew index 2 -- the currency stack, 750 -> 749 -- because every other entry
    #              has quantity 1. A player loses their shirt on one platform and a single gold
    #              piece on the other, from identical input.
    #              This is sim_rng, which is integer arithmetic and cannot diverge on its own. So
    #              the stream must already have diverged upstream, in the combat on the map -- one
    #              more reading that points at entities.
    #              The 'carried' check found this on its first CI run. Do not weaken it.
    #   'beatdown' splits on 'carried' TOO, and that was hidden: the row fails its coverage
    #              requirement on Linux, and run-replays.sh used to stop at a row's first failure,
    #              so the gear numbers were never printed. macOS loots nothing and ends with 0
    #              carried slots; x86-64 Linux loots twice and ends with 1. One divergence was
    #              masking another, which is why the script now reports every behavioural check
    #              for a row before it gives up on it.
    #
    # WHERE THE DIVERGENCE IS, AND IS NOT. This block used to add "every digest differs three ways,
    # INCLUDING 'smoke' -- plain movement already produces three different worlds", and conclude
    # from it that there is no single culprit to find. Both halves were wrong.
    #
    # 'smoke' is NOT plain movement. It is movement on abandoned_mines, which has fifty enemies
    # whose activation and AI run every tick. The rows that really are plain movement are the two
    # that run on the empty test maps, and they do NOT differ by instruction set:
    #
    #   row        map              Linux x86-64        Linux aarch64
    #   smoke      abandoned_mines  0x6cf2c6fb4d2cf49b  0xc69b53f7b33f9743   differ
    #   patrol     abandoned_mines  0x50acdfc34271acc3  0x9a60368fa90e0406   differ
    #   death      abandoned_mines  0xaa9a42be1815d204  0xcc11545eb36db289   differ
    #   deathfull  abandoned_mines  0x399ae5d931e65393  0x18b4933dba5382a5   differ
    #   autoequip  empty room       0xdbde2fa251175f73  0xdbde2fa251175f73   IDENTICAL
    #   equipswap  empty room       0x0ad088f0e0e56138  0x0ad088f0e0e56138   IDENTICAL
    #
    # Identical on both compilers as well, over 900 ticks of walking plus a map event, an item
    # grant, auto-equip and an equipment-set swap. 900 was chosen deliberately: at the rows' first
    # length of 350 and 200 they were also the SHORTEST in the corpus, and "a short run has less
    # chance to diverge" is a perfectly good alternative explanation. Extending them past 'smoke'
    # removed it, and the digests did not move apart. Measured, therefore:
    #
    #   ISA divergence NEEDS ENTITIES.       Two instruction sets, one OS, no entities: identical.
    #   OS divergence does not.              Same ISA, different OS, no entities: still differs
    #                                        (macOS reports 0x7c6b23db6fdf0545 / 0x06cbca6a3c109e24).
    #
    # HYPOTHESIS, and it is only that: arm64 macOS and arm64 Linux share an instruction set, so a
    # divergence between them on a map with nothing on it points at the math library rather than
    # at codegen. Untested. What is tested is the table.
    #
    # Lockstep is still off the table and Phase 3 still uses an authoritative host -- that decision
    # has other support and is not reopened here. But it can no longer be argued from "there is no
    # single culprit to find": nobody has looked, and the search space is now much smaller than
    # this comment used to claim.
    #
    # The matrix STAYS, but not for the reason first written here. That said "a host and a
    # rejoining client still have to agree", which is WRONG: under an authoritative host a
    # rejoining client receives a state snapshot and never simulates, so it needs determinism from
    # nobody. That reasoning was carried over from the lockstep design without being re-checked
    # against the decision that replaced it.
    #
    # The real reason is the COVERAGE assertions, not the digests. They are what found that 'melee'
    # kills nothing on x86-64 Linux and 'beatdown' never triggers the low-HP warning there -- the
    # game is measurably easier on Linux. That is a player-facing difference and it matters whether
    # or not networking is involved. A digest comparison alone would only have said "different
    # hash" on a platform with no golden to compare against.
    #
    # Hence the split below: coverage and liveness are hard failures on every platform, while the
    # digest comparison is a same-machine regression test and only applies where a golden exists.
    # See tests/run-replays.sh.
    #
    # Linux goldens are still deliberately unrecorded. A golden for a platform where 'melee' does
    # not melee would rebuild the P0.5c mistake in a new form -- see the coverage block in
    # tests/run-replays.sh. Missing goldens fail the job AND print the digest, which is what makes
    # one run enough to compare platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        compiler: [ { cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ } ]
    env:
      FLARE_GAME_COMMIT: af6eee6d339ac98011864bfe89da837fe7769c28
      FLARE_GOLDEN_SUFFIX: ${{ matrix.compiler.cc }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq g++ libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Fetch game data
        run: |
          git clone --no-checkout https://github.com/lanrevival/flare-game.git ../flare-game
          git -C ../flare-game checkout "$FLARE_GAME_COMMIT"

      - name: Assemble a combined mods tree
        run: |
          # Neither repo is runnable alone: flare-engine/mods has only 'default', the campaigns
          # live in flare-game/mods.
          mkdir -p /tmp/flaredata/mods
          ln -s "$GITHUB_WORKSPACE/mods/default" /tmp/flaredata/mods/default
          for d in ../flare-game/mods/*/; do ln -s "$(cd "$d" && pwd)" "/tmp/flaredata/mods/$(basename "$d")"; done

      - name: Build server
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake . && make -j4 flare-server

      - name: Run replays
        run: ./tests/run-replays.sh /tmp/flaredata

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get clean -qq
          sudo apt-get update -qq
          sudo apt-get install -qq libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev cppcheck

      - name: Run cppcheck
        run: cppcheck --quiet --verbose --enable=all `git ls-files src/\*.cpp`
